<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HSR Warp Simulator</title>
<style>
    body { font-family: Arial; background:#111; color:white; text-align:center; }
    .banner-select { margin:20px; }
    button { padding:10px 20px; margin:10px; font-size:16px; }
    #result-area { margin-top:25px; font-size:20px; min-height:80px; }
    #history { margin-top:20px; max-width:600px; margin:auto; background:#222; padding:15px; border-radius:10px; }
    .item { margin:4px 0; }
    .animate {
        animation: warp 0.6s ease-in-out;
    }
    @keyframes warp {
        0% { opacity:0; transform:scale(0.5); }
        100% { opacity:1; transform:scale(1); }
    }
</style>
</head>
<body>

<h1>HSR Warp Simulator</h1>

<!-- Banner Selection -->
<div class="banner-select">
    <label><strong>Select Banner:</strong></label><br>
    <select id="banner">
        <option value="standard">Standard Banner</option>
        <option value="limited">Limited Banner</option>
    </select>
</div>

<!-- Pull Buttons -->
<button onclick="pull(1)">Single Pull</button>
<button onclick="pull(10)">10 Pull</button>

<div id="result-area"></div>

<h2>Pull History</h2>
<div id="history"></div>

<script>
// ----------------------------
// Banner Pools
// ----------------------------

// Standard banner characters
const standardCharacters = [
    "Welt", "Himeko", "Gepard", "Yanqing",
    "Asta", "Serval", "Pela", "Natasha"
];

// Standard banner light cones
const standardLightCones = [
    "Night on the Milky Way", "Sleep Like the Dead", "Moment of Victory",
    "Carve the Moon", "Planetary Rendezvous", "Make the World Clamor"
];

// Limited banner characters
const limitedCharacters = [
    "Dan Heng IL", "Kafka", "Blade", "Acheron"
];

// Limited banner exclusive light cones
const limitedLightCones = [
    "Brighter Than the Sun", "Patience Is All You Need",
    "The Unreachable Side", "Along the Passing Shore"
];


// ----------------------------
// Pull Logic
// ----------------------------

let history = []; // store results

function getRandomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function pullOnce(bannerType) {
    let roll = Math.random();

    if (bannerType === "standard") {
        // 50% character / 50% light cone
        if (roll < 0.5) {
            return "Character: " + getRandomItem(standardCharacters);
        } else {
            return "Light Cone: " + getRandomItem(standardLightCones);
        }
    }

    if (bannerType === "limited") {
        // 70% limited char / 30% limited light cone
        if (roll < 0.7) {
            return "LIMITED Character: " + getRandomItem(limitedCharacters);
        } else {
            return "LIMITED Light Cone: " + getRandomItem(limitedLightCones);
        }
    }
}

function pull(amount) {
    const banner = document.getElementById("banner").value;
    const resultArea = document.getElementById("result-area");

    resultArea.classList.remove("animate");
    void resultArea.offsetWidth;
    resultArea.classList.add("animate");

    let results = [];

    for (let i = 0; i < amount; i++) {
        const item = pullOnce(banner);
        results.push(item);
        history.push(item);
    }

    // Display results
    resultArea.innerHTML = results.join("<br>");

    // Update history
    const historyDiv = document.getElementById("history");
    historyDiv.innerHTML = history.map(h => `<div class='item'>${h}</div>`).join("");
}

</script>

</body>
</html>
