<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HSR Warp Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://raw.githubusercontent.com/leox7-bths/hsr-warp-simulator/refs/heads/main/icon.png" type="image/png">
</head>
<body>

<div id="banner-ui">
    <h1>HSR Warp Simulator</h1>

    <!-- Banner selection -->
    <div>
        <label><strong>Select Banner:</strong></label><br>
        <select id="banner">
            <option value="standard">Standard Banner</option>
            <option value="seele">Seele Character Banner 1.0</option>
            <option value="seelelc">Seele Light Cone Banner 1.0</option>
            <option value="jingyuan">Jing Yuan Character Banner 1.0</option>
            <option value="jingyuanlc">Jing Yuan Light Cone Banner 1.0</option>
            <option value="silverwolf">Silver Wolf Character Banner 1.1</option>
            <option value="silverwolflc">Silver Wolf Light Cone Banner 1.1</option>
        </select>
    </div>
</div>

<img id="cheat-icon" src="https://raw.githubusercontent.com/leox7-bths/hsr-warp-simulator/refs/heads/main/icon2.png" style="position:fixed; top:10px; left:10px; width:40px; height:40px; cursor:pointer; z-index:9999;">

<input id="cheat-input" type="text" placeholder="Enter code..." style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 15px; font-size:16px; border-radius:10px; display:none; z-index:9999;">

<div id="banner-screen">

    <!-- Banner Image -->
    <img id="banner-image" src="" alt="Banner Image">

    <!-- LEFT BUTTONS -->
    <div class="banner-left">
        <button class="warp-button" onclick="openSidebar('history')">History</button>
        <button class="warp-button" onclick="window.location.href='collection.html'">Collection</button>
    </div>

    <!-- RIGHT BUTTONS -->
    <div class="banner-right">
        <button class="warp-button" onclick="warp(1)">
            <img src="https://starrail.honeyhunterworld.com/img/item/star-rail-special-pass-item_icon_figure.webp">
            Warp ×1
        </button>

        <button class="warp-button" onclick="warp(10)">
            <img src="https://starrail.honeyhunterworld.com/img/item/star-rail-special-pass-item_icon_figure.webp">
            Warp ×10
        </button>
    </div>

</div>

<!-- Sidebar Panel -->
<div id="sidebar">
    <div id="sidebar-close" onclick="closeSidebar()">✖</div>
    <div id="sidebar-content"></div>
</div>

<!-- Warp animation overlay -->
<div id="warp-screen">
    <canvas id="warp-canvas"></canvas>
    <div id="ticket"></div>
</div>

<!-- Warp Result Screen -->
<div id="result-screen" style="display:none; position:relative;">
    <button id="back-button" onclick="returnToBanner()">✖</button>
    <div id="pull-container"></div>
</div>

<script src="bannerPools.js"></script>

<script>
    let historyStandard = [];
    let historyLimited = [];
    let historyLightcone = [];

    // Rates (approx HSR)
    const rates = {
        r5: 0.006,
        r4: 0.051,
        r3: 1 - (0.006 + 0.051)
    };

    // Pity counters
    let pity5 = 0;
    let pity4 = 0;

    // Limited banner guarantees
    let guaranteedLimited5 = false;
    let guaranteedLimited4 = false;

    // Pull history + collection
    let history = [];
    let collection = {};

    //banner images function
    function updateBannerImage() {
        const banner = document.getElementById("banner").value;
        document.getElementById("banner-image").src = bannerImages[banner];
    }

    function returnToBanner() {
        stopOneByOne = true;
        oneByOneRunning = false;
        activeRipples.forEach(r => {
            clearTimeout(r.dataset.timeout);
            r.remove();
        });
        activeRipples = [];

        document.getElementById("result-screen").style.display = "none";
        document.getElementById("banner-screen").style.display = "inline-block";
        const bannerUI = document.getElementById("banner-ui");
        bannerUI.classList.remove("hidden");
        document.body.style.background = "url('images/background.webp') no-repeat center center fixed";
    }

    // Gacha
    function rollRarity() {
        pity5++;
        pity4++;

        // Hard pity for 5 star
        if (pity5 >= 90) return 5;

        // Soft pity 5 star (starting around 75)
        if (pity5 > 74) {
            let softRate = rates.r5 + (pity5 - 74) * 0.06;
            if (Math.random() < softRate) return 5;
        }

        // Hard pity 4 star
        if (pity4 >= 10) return 4;

        // Roll normally
        let r = Math.random();
        if (r < rates.r5) return 5;
        if (r < rates.r5 + rates.r4) return 4;
        return 3;
    }

    function getItem(rarity, banner) {
        // 5 STAR LOGIC
        if (rarity === 5) {
            pity5 = 0;

            if (cheatGuaranteeNext5) {
                cheatGuaranteeNext5 = false;

                if (banner === "seele") return getRandom(seeleLimited5);
                if (banner === "seelelc") return getRandom(seelelcLimited5);
                if (banner === "jingyuan") return getRandom(jingyuanLimited5);
                if (banner === "jingyuanlc") return getRandom(jingyuanlcLimited5);
                if (banner === "silverwolf") return getRandom(silverWolfLimited5);
                if (banner === "silverwolflc") return getRandom(silverWolflcLimited5);

                // standard banner fallback
                return Math.random() < 0.5 ? getRandom(standard5) : getRandom(standardlc5);
            }

            if (banner === "seele") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(seeleLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            if (banner === "seelelc") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(seelelcLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standardlc5);
                }
            }

            if (banner === "jingyuan") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(jingyuanLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            if (banner === "jingyuanlc") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(jingyuanlcLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standardlc5);
                }
            }

            if (banner === "silverwolf") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(silverWolfLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            if (banner === "silverwolflc") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(silverWolflcLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standardlc5);
                }
            }

            if (Math.random() < 0.5) {
                return getRandom(standardlc5);
            } else {
                return getRandom(standard5);
            }
        }

        // 4 STAR LOGIC
        if (rarity === 4) {
            pity4 = 0;

            // 30% chance to roll a 4-star light cone
            if (Math.random() < 0.3) {
                return getRandom(lightcones4);
            }

            // Otherwise roll a 4-star character

            if (banner === "seele") {
                if (Math.random() < 0.8) {
                    const total = seeleLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of seeleLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

             if (banner === "seelelc") {
                if (Math.random() < 0.8) {
                    const total = seelelcLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;
                    for (let item of seelelcLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(lightcones4);
            }

            if (banner === "jingyuan") {
                if (Math.random() < 0.8) {
                    const total = jingyuanLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of jingyuanLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

             if (banner === "jingyuanlc") {
                if (Math.random() < 0.8) {
                    const total = jingyuanlcLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;
                    for (let item of jingyuanlcLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(lightcones4);
            }

            if (banner === "silverwolf") {
                if (Math.random() < 0.8) {
                    const total = silverWolfLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of silverWolfLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

             if (banner === "silverwolflc") {
                if (Math.random() < 0.8) {
                    const total = silverWolflcLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;
                    for (let item of silverWolflcLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(lightcones4);
            }

            if (banner === "limited") {
                if (guaranteedLimited4 || Math.random() < 0.5) {
                    guaranteedLimited4 = false;
                    return getRandom(all4);
                } else {
                    guaranteedLimited4 = true;
                    return getRandom(all4);
                }
            }

            return getRandom(all4);
        }

        // 3 STAR LOGIC
        // All 3 stars come from the 3 star light cones
        return getRandom(lightcones3);
    }

    // random helper
    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function getStarImages(rarity) {
        return '<img src="images/star.png" style="width:10px;height:10px;margin-right:2px;">'.repeat(rarity);
    }

    let cheatTrashbagActive = false;
    let cheatTrashbagPullsLeft = 0;
    let cheatBlock5Pulls = 0;
    let stopOneByOne = false;
    let oneByOneRunning = false;
    let activeRipples = [];

    // Warp + Animations
    function warp(amount) {
        const bannerUI = document.getElementById("banner-ui");
        bannerUI.classList.add("hidden");
        document.getElementById("banner-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        const banner = document.getElementById("banner").value;
        const container = document.querySelector("#result-screen #pull-container");
        container.innerHTML = "";

        let pulls = [];
        let maxRarity = 3;

        for (let i = 0; i < amount; i++) {
            let rarity;

            if (cheatBlock5Pulls > 0) {
                cheatBlock5Pulls--;
                rarity = rollRarity();
                if (rarity === 5) rarity = 4;
            } else {
                rarity = cheat10x5Star ? 5 : rollRarity();
            }

            let item;

            // Trashbag
            if (cheatTrashbagActive && cheatTrashbagPullsLeft > 0 && Math.random() < 0.05) {
                cheatTrashbagPullsLeft--;
                item = {
                    name: "Trashbag",
                    rarity: 0,
                    img: "https://static.wikia.nocookie.net/houkai-star-rail/images/8/82/Item_Trash.png",
                    isTrash: true
                };
                cheatBlock5Pulls = 10;
            } else {
                item = getItem(rarity, banner);
            }

            pulls.push(item);
            history.push(item);

            if (banner === "seele" || banner === "jingyuan" || banner === "silverwolf") {
                historyLimited.push(item);
            } else if (banner === "seelelc" || banner === "jingyuanlc" || banner === "silverwolflc") {
                historyLightcone.push(item);
            } else {
                historyStandard.push(item);
            }

            if (!collection[item.name]) collection[item.name] = 0;
            collection[item.name]++;

            addToCollection(item);

            maxRarity = Math.max(maxRarity, rarity);
        }

        if (cheat10x5Star && amount === 10) cheat10x5Star = false;

        stopOneByOne = true;
        container.innerHTML = "";
        container.style.display = "none";
        document.body.style.background = "url('images/warp.webp') no-repeat center center fixed";
        document.body.style.backgroundSize = "cover";
        playWarpAnimation(maxRarity, () => {
            if (amount === 10) {
                if (container.oneByOneTimeouts) {
                    container.oneByOneTimeouts.forEach(t => clearTimeout(t));
                }
                container.oneByOneTimeouts = [];

                container.innerHTML = "";

                const layout = [3, 4, 3];
                let idx = 0;

                layout.forEach(rowCount => {
                    const row = document.createElement("div");
                    row.className = "row-container";
                    row.style.display = "flex";
                    row.style.justifyContent = "center";
                    row.style.gap = "10px";
                    row.style.transform = "rotate(-15deg)";
                    row.style.transformOrigin = "center";
                    row.style.margin = "30px 0";

                    for (let j = 0; j < rowCount; j++) {
                        const item = pulls[idx];

                        const div = document.createElement("div");
                        div.className = "pull-item r" + item.rarity;

                        div.classList.add("hidden-card"); // starts off-screen

                        // When the card finishes sliding in, add glow
                        div.addEventListener("transitionend", () => {
                            if (item.rarity === 4 || item.rarity === 5) {
                                div.classList.add("glow");
                            }
                        }, { once: true });

                        if (item.isTrash) div.style.border = "3px solid red";

                        div.innerHTML = `
                            <img src="${item.img}" class="pull-img">
                            <div>
                                <strong>${item.name}</strong><br>
                                ${getStarImages(item.rarity)}
                            </div>
                        `;

                        div.classList.add("hidden-card");
                        div.dataset.index = idx;

                        row.appendChild(div);
                        idx++;
                    }

                    container.appendChild(row);
                });
                setTimeout(() => {
                    div.classList.remove("hidden-card");
                    div.classList.add("show");
                }, 50);

                container.style.display = "none";
                playOneByOne(pulls, container);

            } else {
                // Single pulls
                container.innerHTML = "";
                container.style.display = "block";

                const item = pulls[0];

                // Create row container
                const row = document.createElement("div");
                row.className = "row-container";
                row.style.display = "flex";
                row.style.justifyContent = "center";
                row.style.gap = "10px";
                row.style.transform = "rotate(-15deg)";
                row.style.transformOrigin = "center";
                row.style.margin = "30px 0";

                // Create card
                const div = document.createElement("div");
                div.className = "pull-item r" + item.rarity;

                div.classList.add("hidden-card"); // starts off-screen

                // When the card finishes sliding in, add glow
                div.addEventListener("transitionend", () => {
                    if (item.rarity === 4 || item.rarity === 5) {
                        div.classList.add("glow");
                    }
                }, { once: true });

                setTimeout(() => {
                    div.classList.remove("hidden-card");
                    div.classList.add("show");
                }, 50);

                div.innerHTML = `
                    <img src="${item.img}" class="pull-img">
                    <div>
                        <strong>${item.name}</strong><br>
                        ${getStarImages(item.rarity)}
                    </div>
                `;

                div.classList.add("hidden-card");

                row.appendChild(div);

                container.appendChild(row);

                setTimeout(() => {
                    div.classList.remove("hidden-card");
                    div.classList.add("show");
                }, 50);
            }
                
            updateHistory();
        });
    }

    function playOneByOne(pulls, gridContainer) {
        const resultScreen = document.getElementById("result-screen");
        const bannerUI = document.getElementById("banner-ui");

        // Stop any old one-by-one animation
        stopOneByOne = true;

        // Cleanup old reveal layer
        const oldLayer = document.getElementById("fullscreen-reveal");
        if (oldLayer) oldLayer.remove();

        // Stop all active ripples immediately
        activeRipples.forEach(r => {
            clearTimeout(r.dataset.timeout);
            r.remove();
        });
        activeRipples = [];

        stopOneByOne = false;
        oneByOneRunning = true;

        let index = 0;

        // Fullscreen layer for showing items
        const revealLayer = document.createElement("div");
        revealLayer.id = "fullscreen-reveal";
        resultScreen.appendChild(revealLayer);

        function showItem(item) {
            if (stopOneByOne) return;

            revealLayer.innerHTML = "";

            const wrapper = document.createElement("div");
            wrapper.className = "hsr-single r" + item.rarity;

            const isCharacter = !item.img.includes("lc");
            const imgSize = isCharacter ? "1200px" : "400px";

            wrapper.innerHTML = `
                <div class="hsr-layout">
                    <div class="hsr-name">
                        <h1>${item.name}</h1>
                        <p>
                            ${'<img src="images/star.png" style="width:15px; height:15px; margin-right:2px;">'.repeat(item.rarity)}
                        </p>
                    </div>
                    <div class="hsr-image">
                        <img src="${item.img}" style="width:${imgSize}; height:auto;">
                    </div>
                </div>
            `;

            revealLayer.appendChild(wrapper);

            // Show wrapper with slight delay for fade-in effect
            setTimeout(() => {
                if (!stopOneByOne) wrapper.classList.add("show");
            }, 30);
        }

        function finishOneByOne() {
            oneByOneRunning = false;

            // Remove reveal layer
            revealLayer.remove();

            // Show the grid of all items
            gridContainer.style.display = "block";
            const cards = gridContainer.querySelectorAll(".pull-item");
            cards.forEach((card, i) => {
                card.classList.remove("hidden-card");
                setTimeout(() => card.classList.add("show"), 100 * i);
            });
        }

        function next() {
            // If stopping early, end immediately
            if (stopOneByOne) {
                // Remove all ripples instantly
                activeRipples.forEach(r => {
                    clearTimeout(r.dataset.timeout);
                    r.remove();
                });
                activeRipples = [];

                finishOneByOne();
                return;
            }

            // If all pulls have been revealed, finish
            if (index >= pulls.length) {
                finishOneByOne();
                return;
            }

            // Create ripple for current item
            createRipple(pulls[index].rarity);

            // Show the current item
            showItem(pulls[index]);

            index++;
        }

        // Clicking anywhere goes to next item
        document.onclick = () => {
            if (!oneByOneRunning) return;
            next();
        };

        // Start first item
        next();
    }

    function showSidebarHistory() {
        const box = document.getElementById("sidebar-content");
        box.innerHTML = `<h2>Pull History</h2><div class='section-title'>Limited Banner</div>`;

        // Numbered Limited Banner
        historyLimited.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });

        box.innerHTML += `<div class='section-title'>Light Cone Banner</div>`;

        // Numbered Light Cone Banner
        historyLightcone.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });

        box.innerHTML += `<div class='section-title'>Standard Banner</div>`;

        // Numbered Standard Banner
        historyStandard.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });
    }

    function openSidebar(type) {
        const sidebar = document.getElementById("sidebar");
        const box = document.getElementById("sidebar-content");

        sidebar.classList.add("active");

        if (type === "history") {
            showSidebarHistory();
        }
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
    }
    
    function playWarpAnimation(rarity, callback) {
        const screen = document.getElementById("warp-screen");
        const ticket = document.getElementById("ticket");
        const canvas = document.getElementById("warp-canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Star parameters
        const starCount = 80;
        const minRadius = 100;
        const maxRadius = 300;
        const stars = [];

        for (let i = 0; i < starCount; i++) {
            const angle = Math.random() * 2 * Math.PI;
            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const speed = 0.01 + Math.random() * 0.03;
            const size = 2 + Math.random() * 2;
            const color = (rarity === 5 && Math.random() < 0.2) ? "#FFD700" : (Math.random() < 0.5 ? "#7abaff" : "#d29aff");
            const alphaSpeed = 0.02 + Math.random() * 0.03; // fade speed
            const alphaOffset = Math.random();
            stars.push({ angle, radius, speed, size, color, alpha: 0, alphaSpeed, alphaOffset });
        }

        let frame = 0;

        function animate() {
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.angle += star.speed;

                // Star position
                const x = cx + Math.cos(star.angle) * star.radius;
                const y = cy + Math.sin(star.angle) * star.radius;

                // Fade in/out for twinkle
                star.alpha = 0.5 + 0.5 * Math.sin(frame * star.alphaSpeed + star.alphaOffset * Math.PI * 2);

                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(${hexToRgb(star.color)},${star.alpha})`;
                ctx.fill();
            });

            frame++;
            if (frame < 90) requestAnimationFrame(animate); // ~1.5s
        }

        // Flash and ticket
        screen.classList.remove("gold-flash", "purple-flash", "blue-flash");
        if (rarity === 5) screen.classList.add("gold-flash");
        else if (rarity === 4) screen.classList.add("purple-flash");
        else screen.classList.add("blue-flash");

        screen.classList.add("active");
        ticket.classList.add("show");

        animate();

        setTimeout(() => {
            screen.classList.remove("active");
            ticket.classList.remove("show");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            callback();
        }, 1500);
    }

    // Helper: convert hex to r,g,b
    function hexToRgb(hex) {
        hex = hex.replace("#", "");
        const bigint = parseInt(hex, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `${r},${g},${b}`;
    }

    function updateHistory() {
        const h = document.getElementById("history");
        h.innerHTML = history.map(i =>
            `<div>${i.name} — ${i.rarity} star</div>`
        ).join("");
    }

    function addToCollection(item) {
        let coll = JSON.parse(localStorage.getItem("hsrCollection") || "{}");
        if (!coll[item.name]) coll[item.name] = 0;
        coll[item.name]++;
        localStorage.setItem("hsrCollection", JSON.stringify(coll));
    }

    let clickTimes = [];
    const cheatIcon = document.getElementById("cheat-icon");
    const cheatInput = document.getElementById("cheat-input");

    let cheatActive = false;
    let cheat10x5Star = false;
    let hardMode = false;
    let cheatGuaranteeNext5 = false;

    cheatIcon.addEventListener("click", () => {
        const now = Date.now();
        clickTimes.push(now);

        clickTimes = clickTimes.filter(t => now - t <= 3000);

        if (clickTimes.length >= 10 && !cheatActive) {
            cheatActive = true;
            cheatInput.style.display = "block";
            cheatInput.focus();
        }
    });

    cheatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            if (cheatInput.value.toUpperCase() === "LUCKY") {
                alert("Cheat activated! Next 10 pulls are all guaranteed 5 star!");
                cheat10x5Star = true;
            }
            if (cheatInput.value.toUpperCase() === "DIOLATASUCKS") {
                alert("Challenge activated! Next 100 pulls there is the chance to get a trashbag (which will not let a five character appear for the next 10 pull)!");
                cheatTrashbagActive = true;
                cheatTrashbagPullsLeft = 100;
            }
            if (cheatInput.value.toUpperCase() === "GUARANTEE") {
                alert("Cheat activated! Next 5 star will be the featured character/light cone!");
                cheatGuaranteeNext5 = true;
            }
            cheatInput.value = "";
            cheatInput.style.display = "none";
            cheatActive = false;
            clickTimes = [];
        }
    });

    function createRipple(rarity) {
        const ripple = document.createElement("div");
        ripple.className = `ripple-effect ripple-${rarity}`;
        document.body.appendChild(ripple);

        activeRipples.push(ripple);

        const timeout = setTimeout(() => {
            ripple.remove();
            activeRipples = activeRipples.filter(r => r !== ripple);
        }, 1000);

        ripple.dataset.timeout = timeout;
    }

    document.body.style.background = "url('images/background.webp') no-repeat center center fixed";
    document.getElementById("banner").addEventListener("change", updateBannerImage);
    updateBannerImage();
</script>

</body>
</html>
