<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HSR Warp Simulator</title>

<style>
    body {
        font-family: Arial;
        background: #0d0d0d;
        color: white;
        text-align: center;
        overflow-x: hidden;
        margin: 0;
    }

    h1 { margin-top: 20px; }

    select, button {
        padding: 10px 15px;
        margin: 10px;
        font-size: 16px;
    }

    /* Pull reveal container */
    #pull-container {
        margin-top: 25px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        min-height: 200px;
        z-index: 100;
        position: relative;
    }

    /* Sliding items */
    .pull-item {
        width: 260px;
        padding: 10px;
        background: #222;
        border-radius: 10px;
        display: flex;
        align-items: center;
        opacity: 0;
        transform: translateX(-300px);
        transition: all 0.4s ease;
        gap: 10px;
        border: 2px solid #333;
    }

    .pull-item img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
    }

    .pull-item.show {
        opacity: 1;
        transform: translateX(0px);
    }

    /* Color borders based on rarity */
    .r3 { border-color: #4aa3ff; }
    .r4 { border-color: #c55bff; }
    .r5 { border-color: #ffcc33; }

    /* Warp screen overlay animation */
    #warp-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
    }

/* Container fixed at bottom center */
#warp-buttons {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
    z-index: 1000; /* stay above other content */
}

    .warp-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        font-size: 16px;
        font-weight: bold;
        color: #000000;
        background: linear-gradient(135deg, #ffffff, #ffffff);
        border: 2px solid #d5d5d5;
        border-radius: 25px;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .warp-button img {
        width: 24px;
        height: 24px;
    }

    .warp-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    #warp-screen.active {
        opacity: 1;
    }

    #ticket {
        width: 140px;
        height: 140px;
        background: url('https://static.wikia.nocookie.net/houkai-star-rail/images/4/48/Enemy_Trotter_of_Destruction.png') no-repeat center;
        background-size: contain;
        animation: spin 1s linear infinite;
        opacity: 0;
    }

    #ticket.show {
        opacity: 1;
    }

    @keyframes spin {
        0% { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* Flash colors */
    .gold-flash { background: radial-gradient(circle, #ffdd66, #c48c00); }
    .purple-flash { background: radial-gradient(circle, #d29aff, #5e2d91); }
    .blue-flash { background: radial-gradient(circle, #7abaff, #1d3d66); }

    /* Collection page */
    #collection-box {
        margin-top: 40px;
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 700px;
        margin: 40px auto;
        display: none;
        text-align: left;
    }

    .collection-entry {
        margin: 8px 0;
        padding: 10px;
        background: #222;
        border-radius: 8px;
    }

        /* Right Sidebar */
    #sidebar {
        position: fixed;
        top: 0;
        right: -350px;
        width: 350px;
        height: 100vh;
        background: #141414;
        border-left: 2px solid #333;
        box-shadow: -4px 0 10px rgba(0,0,0,0.7);
        transition: right 0.35s ease;
        padding: 20px;
        overflow-y: auto;
        z-index: 99999;
    }

    #sidebar.active {
        right: 0;
    }

    #sidebar-close {
        font-size: 22px;
        cursor: pointer;
        margin-bottom: 15px;
        text-align: right;
    }

    .section-title {
        margin-top: 15px;
        font-size: 18px;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
    }
</style>

</head>
<body>

<h1>HSR Warp Simulator</h1>

<!-- Banner selection -->
<div>
    <label><strong>Select Banner:</strong></label><br>
    <select id="banner">
        <option value="standard">Standard Banner</option>
        <option value="seele">Seele Banner 1.4</option>
    </select>
</div>

<div id="warp-buttons">
    <button class="warp-button" onclick="warp(1)">
        <img src="https://starrail.honeyhunterworld.com/img/item/star-rail-special-pass-item_icon_figure.webp">
        Warp ×1
    </button>

    <button class="warp-button" onclick="warp(10)">
        <img src="https://starrail.honeyhunterworld.com/img/item/star-rail-special-pass-item_icon_figure.webp">
        Warp ×10
    </button>
    <button class="warp-button" onclick="openSidebar('collection')">Collection</button>
    <button class="warp-button" onclick="openSidebar('history')">History</button>
</div>  

<!-- Sidebar Panel -->
<div id="sidebar">
    <div id="sidebar-close" onclick="closeSidebar()">✖</div>
    <div id="sidebar-content"></div>
</div>

<!-- Warp animation overlay -->
<div id="warp-screen">
    <div id="ticket"></div>
</div>

<!-- Pull results -->
<div id="pull-container"></div>

<!-- Collection -->
<div id="collection-box"></div>

<script>
    let historyStandard = [];
    let historyLimited = [];

    // Rates (approx HSR)
    const rates = {
        r5: 0.006,
        r4: 0.051,
        r3: 1 - (0.006 + 0.051)
    };

    // Pity counters
    let pity5 = 0;
    let pity4 = 0;

    // Limited banner guarantees
    let guaranteedLimited5 = false;
    let guaranteedLimited4 = false;

    // Pull history + collection
    let history = [];
    let collection = {}; // key = item name, value = count

    // BANNER POOLS

    // STANDARD 5 star CHARACTERS
    const standard5 = [
        { name:"Welt", rarity:5, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/1/11/Character_Welt_Splash_Art.png" },
        { name:"Gepard", rarity:5, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/9/96/Character_Gepard_Splash_Art.png" },
        { name:"Himeko", rarity:5, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/8/8e/Character_Himeko_Splash_Art.png" }
    ];

    // STANDARD 4 star CHARACTERS
    const all4 = [
        { name:"Asta", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/bd/Character_Asta_Splash_Art.png" },
        { name:"Serval", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/8/8a/Character_Serval_Splash_Art.png" },
        { name:"Natasha", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/7/7e/Character_Natasha_Splash_Art.png" },
        { name: "Hook", rarity: 4, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/e/ec/Character_Hook_Splash_Art.png"},
        { name: "Pela", rarity: 4, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/c/c9/Character_Pela_Splash_Art.png"}
    ];

    // 3 star LIGHT CONES
    const lightcones3 = [
        { name:"Fine Fruit", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/7/70/Light_Cone_Fine_Fruit.png" },
        { name:"Passkey", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/a/a4/Light_Cone_Passkey.png" },
        { name:"Amber", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/4/42/Light_Cone_Amber.png" },
        { name:"Void", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/3/37/Light_Cone_Void.png" },
        { name:"Chorus", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/e/e2/Light_Cone_Chorus.png" },
        { name:"Data Bank", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/a/ac/Light_Cone_Data_Bank.png" },
        { name:"Darting Arrow", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/5/51/Light_Cone_Darting_Arrow.png" },
        { name:"Collapsing Sky", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/d/d0/Light_Cone_Collapsing_Sky.png" },
        { name:"Shattered Home", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/6/62/Light_Cone_Shattered_Home.png" },
        { name:"Loop", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/d/d8/Light_Cone_Loop.png" },
        { name:"Meshing Cogs", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/8/89/Light_Cone_Meshing_Cogs.png" },
        { name:"Defense", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/9/96/Light_Cone_Defense.png" },
        { name:"Mutual Demise", rarity:3, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/a/a0/Light_Cone_Mutual_Demise.png" }
    ];

const lightcones4 = [
    { name:"Only Silence Remains", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/e/e2/Light_Cone_Only_Silence_Remains.png" },
    { name:"Swordplay", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/b9/Light_Cone_Swordplay.png" },
    { name:"River Flows in Spring", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/b3/Light_Cone_River_Flows_in_Spring.png" },
    { name:"For Tomorrow's Journey", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/a/aa/Light_Cone_For_Tomorrow%27s_Journey.png" },
    { name:"Subscribe for More!", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/5/57/Light_Cone_Subscribe_for_More%21.png" },
    { name:"Geniuses' Repose", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/b9/Light_Cone_Geniuses%27_Repose.png" },
    { name:"Memories of the Past", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/1/15/Light_Cone_Memories_of_the_Past.png" },
    { name:"The Moles Welcome You", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/5/5a/Light_Cone_The_Moles_Welcome_You.png" },
    { name:"Planetary Rendezvous", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/b0/Light_Cone_Planetary_Rendezvous.png" },
    { name:"Dance! Dance! Dance!", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/6/64/Light_Cone_Dance%21_Dance%21_Dance%21.png" },
    { name:"Carve the Moon, Weave the Clouds", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/1/1f/Light_Cone_Carve_the_Moon%2C_Weave_the_Clouds.png" },
    { name:"Shared Feeling", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/3/35/Light_Cone_Shared_Feeling.png" },
    { name:"Post-Op Conversation", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/0/03/Light_Cone_Post-Op_Conversation.png" },
    { name:"Perfect Timing", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/7/77/Light_Cone_Perfect_Timing.png" },
    { name:"Quid Pro Quo", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/7/71/Light_Cone_Quid_Pro_Quo.png" },
    { name:"Trend of the Universal Market", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/8/8a/Light_Cone_Trend_of_the_Universal_Market.png" },
    { name:"Landau's Choice", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/b/b7/Light_Cone_Landau%27s_Choice.png" },
    { name:"Day One of My New Life", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/6/61/Light_Cone_Day_One_of_My_New_Life.png" },
    { name:"This Is Me!", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/c/cb/Light_Cone_This_Is_Me%21.png" },
    { name:"We Are Wildfire", rarity:4, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/c/c2/Light_Cone_We_Are_Wildfire.png" }
];

    // const limited5 = [
    //     { name:"Acheron", rarity:5, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/7/78/Character_Acheron_Splash_Art.png" },
    //     { name:"Kafka", rarity:5, img:"https://static.wikia.nocookie.net/houkai-star-rail/images/9/95/Character_Kafka_Splash_Art.png" }
    // ];

    // Seele
    const seeleLimited5 = [
        { name: "Seele", rarity: 5, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/5/58/Character_Seele_Splash_Art.png" }
    ];

    const seeleLimited4 = [
        { name: "Natasha", rarity: 4, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/7/7e/Character_Natasha_Splash_Art.png", rate: 0.33 },
        { name: "Hook", rarity: 4, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/e/ec/Character_Hook_Splash_Art.png", rate: 0.33 },
        { name: "Pela", rarity: 4, img: "https://static.wikia.nocookie.net/houkai-star-rail/images/c/c9/Character_Pela_Splash_Art.png", rate: 0.33 }
    ];

    // Gacha
    function rollRarity() {
        pity5++;
        pity4++;

        // Hard pity for 5 star
        if (pity5 >= 90) return 5;

        // Soft pity 5 star (starting around 75)
        if (pity5 > 74) {
            let softRate = rates.r5 + (pity5 - 74) * 0.06;
            if (Math.random() < softRate) return 5;
        }

        // Hard pity 4 star
        if (pity4 >= 10) return 4;

        // Roll normally
        let r = Math.random();
        if (r < rates.r5) return 5;
        if (r < rates.r5 + rates.r4) return 4;
        return 3;
    }

    function getItem(rarity, banner) {
        // 5 STAR LOGIC
        if (rarity === 5) {
            pity5 = 0;

            if (banner === "seele") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(seeleLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            return getRandom(standard5);
        }

        // 4 STAR LOGIC
        if (rarity === 4) {
            pity4 = 0;

            // 30% chance to roll a 4-star light cone
            if (Math.random() < 0.3) {
                return getRandom(lightcones4);
            }

            // Otherwise roll a 4-star character

            if (banner === "seele") {
                if (Math.random() < 0.8) {
                    const total = seeleLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of seeleLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

            if (banner === "limited") {
                if (guaranteedLimited4 || Math.random() < 0.5) {
                    guaranteedLimited4 = false;
                    return getRandom(all4);
                } else {
                    guaranteedLimited4 = true;
                    return getRandom(all4);
                }
            }

            return getRandom(all4);
        }

        // 3 STAR LOGIC
        // All 3 stars come from the 3 star light cones
        return getRandom(lightcones3);
    }

    // random helper
    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    // Warp + Animations
    function warp(amount) {
        const banner = document.getElementById("banner").value;
        const container = document.getElementById("pull-container");
        container.innerHTML = "";

        let pulls = [];
        let maxRarity = 3;

        for (let i = 0; i < amount; i++) {
            const rarity = rollRarity();
            const item = getItem(rarity, banner);
            pulls.push(item);
            history.push(item);

            if (banner === "standard") historyStandard.push(item);
            else historyLimited.push(item);

            if (!collection[item.name]) collection[item.name] = 0;
            collection[item.name]++;
            
            maxRarity = Math.max(maxRarity, rarity);
        }

        playWarpAnimation(maxRarity, () => {
            if (amount === 10) {
                // Custom 10-pull layout
                const layout = [3, 4, 3]; // rows
                function shuffleArray(arr) {
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                }
                let idx = 0;
                layout.forEach(rowCount => {
                    const row = document.createElement("div");
                    row.style.display = "flex";
                    row.style.justifyContent = "center";
                    row.style.gap = "10px";
                    for (let j = 0; j < rowCount; j++) {
                        const item = pulls[idx];
                        const div = document.createElement("div");
                        div.className = "pull-item r" + item.rarity;
                        div.innerHTML = `
                            <img src="${item.img}">
                            <div><strong>${item.name}</strong><br>${item.rarity}★</div>
                        `;
                        row.appendChild(div);
                        setTimeout(() => div.classList.add("show"), 300 * idx);
                        idx++;
                    }
                    container.appendChild(row);
                });
            } else {
                // Normal single pull or other amounts
                pulls.forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "pull-item r" + item.rarity;
                    div.innerHTML = `
                        <img src="${item.img}">
                        <div><strong>${item.name}</strong><br>${item.rarity}★</div>
                    `;
                    container.appendChild(div);
                    setTimeout(() => div.classList.add("show"), 300 * index);
                });
            }
            updateHistory();
        });
    }

    function showSidebarCollection() {
        const box = document.getElementById("sidebar-content");
        box.innerHTML = "<h2>Collection</h2>";

        Object.entries(collection).forEach(([name, count]) => {
            box.innerHTML += `
                <div class='collection-entry'>
                    <strong>${name}</strong> — Owned: ${count}
                </div>
            `;
        });
    }

    function showSidebarHistory() {
        const box = document.getElementById("sidebar-content");
        box.innerHTML = `<h2>Pull History</h2><div class='section-title'>Limited Banner</div>`;

        // Numbered Limited Banner
        historyLimited.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white"; // 5★ = gold
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity}★</div>
                </div>
            `;
        });

        box.innerHTML += `<div class='section-title'>Standard Banner</div>`;

        // Numbered Standard Banner
        historyStandard.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity}★</div>
                </div>
            `;
        });
    }

    function openSidebar(type) {
        const sidebar = document.getElementById("sidebar");
        const box = document.getElementById("sidebar-content");

        sidebar.classList.add("active");

        if (type === "collection") {
            showSidebarCollection();
        } else if (type === "history") {
            showSidebarHistory();
        }
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
    }

    function playWarpAnimation(rarity, callback) {
        const screen = document.getElementById("warp-screen");
        const ticket = document.getElementById("ticket");

        screen.classList.remove("gold-flash", "purple-flash", "blue-flash");
        if (rarity === 5) screen.classList.add("gold-flash");
        else if (rarity === 4) screen.classList.add("purple-flash");
        else screen.classList.add("blue-flash");

        screen.classList.add("active");
        ticket.classList.add("show");

        setTimeout(() => {
            screen.classList.remove("active");
            ticket.classList.remove("show");
            callback();
        }, 1500);
    }

    function updateHistory() {
        const h = document.getElementById("history");
        h.innerHTML = history.map(i =>
            `<div>${i.name} — ${i.rarity}★</div>`
        ).join("");
    }

    function toggleCollection() {
        const box = document.getElementById("collection-box");
        if (box.style.display === "none") showCollection();
        else box.style.display = "none";
    }

    function showCollection() {
        const box = document.getElementById("collection-box");
        box.style.display = "block";
        box.innerHTML = "<h2>Your Collection</h2>";

        Object.entries(collection).forEach(([name, count]) => {
            box.innerHTML += `
                <div class='collection-entry'>
                    <strong>${name}</strong> — Owned: ${count}
                </div>
            `;
        });
    }
</script>

</body>
</html>
