<title>HSR Warp Simulator</title>

<style>
    body {
        font-family: Arial;
        background: #0d0d0d;
        color: white;
        text-align: center;
        overflow-x: hidden;
        margin: 0;
    }

    h1 { margin-top: 20px; }

    select, button {
        padding: 10px 15px;
        margin: 10px;
        font-size: 16px;
    }

    /* Pull reveal container */
    #pull-container {
        margin-top: 25px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        min-height: 200px;
        z-index: 100;
        position: relative;
    }

    /* Sliding items */
    .pull-item {
        width: 260px;
        padding: 10px;
        background: #222;
        border-radius: 10px;
        display: flex;
        align-items: center;
        opacity: 0;
        transform: translateX(-300px);
        transition: all 0.4s ease;
        gap: 10px;
        border: 2px solid #333;
    }

    .pull-item img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
    }

    .pull-item.show {
        opacity: 1;
        transform: translateX(0px);
    }

    /* Color borders based on rarity */
    .r3 { border-color: #4aa3ff; }
    .r4 { border-color: #c55bff; }
    .r5 { border-color: #ffcc33; }

    /* Warp screen overlay animation */
    #warp-screen {
        position: fixed;
        top: 0; left: 0;
        width: 100vw;
        height: 100vh;
        background: black;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999;
    }

    /* Container fixed at bottom center */
    .warp-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 20px;
        font-size: 16px;
        font-weight: bold;
        color: #000000;
        background: linear-gradient(135deg, #ffffff, #ffffff);
        border: 2px solid #d5d5d5;
        border-radius: 25px;
        cursor: pointer;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .warp-button img {
        width: 24px;
        height: 24px;
    }

    .warp-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    #warp-screen.active {
        opacity: 1;
    }

    #ticket.show {
        opacity: 1;
    }

    @keyframes spin {
        0% { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(360deg) scale(1); }
    }

    /* Flash colors */
    .gold-flash { background: radial-gradient(circle, #ffdd66, #c48c00); }
    .purple-flash { background: radial-gradient(circle, #d29aff, #5e2d91); }
    .blue-flash { background: radial-gradient(circle, #7abaff, #1d3d66); }

    /* Collection page */
    #collection-box {
        margin-top: 40px;
        background: #1a1a1a;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 700px;
        margin: 40px auto;
        display: none;
        text-align: left;
    }

    .collection-entry {
        margin: 8px 0;
        padding: 10px;
        background: #222;
        border-radius: 8px;
    }

        /* Right Sidebar */
    #sidebar {
        position: fixed;
        top: 0;
        right: -350px;
        width: 350px;
        height: 100vh;
        background: #141414;
        border-left: 2px solid #333;
        box-shadow: -4px 0 10px rgba(0,0,0,0.7);
        transition: right 0.35s ease;
        padding: 20px;
        overflow-y: auto;
        z-index: 99999;
    }

    #sidebar.active {
        right: 0;
    }

    #sidebar-close {
        font-size: 22px;
        cursor: pointer;
        margin-bottom: 15px;
        text-align: right;
    }

    .section-title {
        margin-top: 15px;
        font-size: 18px;
        border-bottom: 1px solid #444;
        padding-bottom: 5px;
    }

    /* Banner Screen */
    #banner-screen {
        position: relative;
        margin-top: 20px;
        display: inline-block;
    }

    #banner-image {
        width: 90%;
        max-width: 900px;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(255,255,255,0.2);
        display: block;
    }

    /* Left and Right Base */
    .banner-left {
        position: absolute;
        bottom: 0.1px;
        display: flex;
        z-index: 1000;
    }
    
    .banner-right {
        position: absolute;
        bottom: 0.1px;
        display: flex;
        gap: 15px;
        z-index: 1000;
    }

    /* Left side */
    .banner-left {
        left: 20px;
    }

    /* Right side */
    .banner-right {
        right: 100px;
    }

    /* Result Screen */
    #result-screen {
        margin-top: 20px;
        position: relative;
        z-index: 2000;
    }

    /* Back Button */
    #back-button {
        position: absolute;
        top: 15px;
        right: 40px;
        padding: 8px 15px;
        font-size: 14px;
        font-weight: bold;
        background: white;
        border-radius: 20px;
        cursor: pointer;
        z-index: 3000;
    }

    #warp-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 997;
    }

    #ticket {
        position: relative;
        z-index: 998;
        width: 140px;
        height: 140px;
        background: url('https://static.wikia.nocookie.net/houkai-star-rail/images/4/48/Enemy_Trotter_of_Destruction.png') no-repeat center;
        background-size: contain;
        animation: spin 1s linear infinite;
        opacity: 0;
        margin: 0 auto;
    }
</style>

        const banner = document.getElementById("banner").value;
        document.getElementById("banner-image").src = bannerImages[banner];
    }

    function returnToBanner() {
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("banner-screen").style.display = "inline-block";
    }

    // Gacha
    function rollRarity() {
        pity5++;
        pity4++;

        // Hard pity for 5 star
        if (pity5 >= 90) return 5;

        // Soft pity 5 star (starting around 75)
        if (pity5 > 74) {
            let softRate = rates.r5 + (pity5 - 74) * 0.06;
            if (Math.random() < softRate) return 5;
        }

        // Hard pity 4 star
        if (pity4 >= 10) return 4;

        // Roll normally
        let r = Math.random();
        if (r < rates.r5) return 5;
        if (r < rates.r5 + rates.r4) return 4;
        return 3;
    }

    function getItem(rarity, banner) {
        // 5 STAR LOGIC
        if (rarity === 5) {
            pity5 = 0;

            if (banner === "seele") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(seeleLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            if (banner === "seelelc") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(seelelcLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standardlc5);
                }
            }

            if (banner === "jingyuan") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(jingyuanLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standard5);
                }
            }

            if (banner === "jingyuanlc") {
                if (guaranteedLimited5 || Math.random() < 0.5) {
                    guaranteedLimited5 = false;
                    return getRandom(jingyuanlcLimited5);
                } else {
                    guaranteedLimited5 = true;
                    return getRandom(standardlc5);
                }
            }

            if (Math.random() < 0.5) {
                return getRandom(standardlc5);
            } else {
                return getRandom(standard5);
            }
        }

        // 4 STAR LOGIC
        if (rarity === 4) {
            pity4 = 0;

            // 30% chance to roll a 4-star light cone
            if (Math.random() < 0.3) {
                return getRandom(lightcones4);
            }

            // Otherwise roll a 4-star character

            if (banner === "seele") {
                if (Math.random() < 0.8) {
                    const total = seeleLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of seeleLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

             if (banner === "seelelc") {
                if (Math.random() < 0.8) {
                    const total = seelelcLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;
                    for (let item of seelelcLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(lightcones4);
            }

            if (banner === "jingyuan") {
                if (Math.random() < 0.8) {
                    const total = jingyuanLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;

                    for (let item of jingyuanLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(all4);
            }

             if (banner === "jingyuanlc") {
                if (Math.random() < 0.8) {
                    const total = jingyuanlcLimited4.reduce((sum, item) => sum + item.rate, 0);
                    let rand = Math.random() * total;
                    for (let item of jingyuanlcLimited4) {
                        rand -= item.rate;
                        if (rand <= 0) return item;
                    }
                }
                return getRandom(lightcones4);
            }

            if (banner === "limited") {
                if (guaranteedLimited4 || Math.random() < 0.5) {
                    guaranteedLimited4 = false;
                    return getRandom(all4);
                } else {
                    guaranteedLimited4 = true;
                    return getRandom(all4);
                }
            }

            return getRandom(all4);
        }

        // 3 STAR LOGIC
        // All 3 stars come from the 3 star light cones
        return getRandom(lightcones3);
    }

    // random helper
    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    let cheatTrashbagActive = false;
    let cheatTrashbagPullsLeft = 0;
    let cheatBlock5Pulls = 0;

    // Warp + Animations
    function warp(amount) {
        document.getElementById("banner-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        const banner = document.getElementById("banner").value;
        const container = document.querySelector("#result-screen #pull-container");
        container.innerHTML = "";

        let pulls = [];
        let maxRarity = 3;

        for (let i = 0; i < amount; i++) {
            let rarity;

            if (cheatBlock5Pulls > 0) {
                cheatBlock5Pulls--;
                rarity = rollRarity();
                if (rarity === 5) rarity = 4; // block 5-star
            } else {
                rarity = cheat10x5Star ? 5 : rollRarity();
            }

            let item;

            // Trashbag cheat
            if (cheatTrashbagActive && cheatTrashbagPullsLeft > 0 && Math.random() < 0.05) {
                cheatTrashbagPullsLeft--;
                item = {
                    name: "Trashbag",
                    rarity: 0,
                    img: "https://static.wikia.nocookie.net/houkai-star-rail/images/8/82/Item_Trash.png",
                    isTrash: true
                };
                cheatBlock5Pulls = 10; // block 5-stars after Trashbag
            } else {
                item = getItem(rarity, banner);
            }

            pulls.push(item);
            history.push(item);

            if (banner === "seele" || banner === "jingyuan") {
                historyLimited.push(item);
            }
            else if (banner === "seelelc" || banner === "jingyuanlc") {
                historyLightcone.push(item); 
            } else {
                historyStandard.push(item);
            }

            if (!collection[item.name]) collection[item.name] = 0;
            collection[item.name]++;

            maxRarity = Math.max(maxRarity, rarity);
        }

        if (cheat10x5Star && amount === 10) cheat10x5Star = false;

        playWarpAnimation(maxRarity, () => {
            if (amount === 10) {
                // layout: 3 top, 4 middle, 3 bottom
                const layout = [3, 4, 3];
                let idx = 0;
                layout.forEach(rowCount => {
                    const row = document.createElement("div");
                    row.style.display = "flex";
                    row.style.justifyContent = "center";
                    row.style.gap = "10px";

                    for (let j = 0; j < rowCount; j++) {
                        const item = pulls[idx];
                        const div = document.createElement("div");
                        div.className = "pull-item r" + item.rarity;
                        if (item.isTrash) div.style.border = "3px solid red";
                        div.innerHTML = `
                            <img src="${item.img}" class="pull-img">
                            <div><strong>${item.name}</strong><br>${item.rarity} star</div>
                        `;
                        row.appendChild(div);

                        setTimeout(() => {
                            div.classList.add("show");
                            setTimeout(() => div.style.boxShadow = "", 500);
                        }, 300 * idx);

                        idx++;
                    }

                    container.appendChild(row);
                });
            } else {
                // single pulls
                pulls.forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "pull-item r" + item.rarity;
                    if (item.isTrash) div.style.border = "3px solid red";
                    div.innerHTML = `
                        <img src="${item.img}" class="pull-img">
                        <div><strong>${item.name}</strong><br>${item.rarity} star</div>
                    `;
                    container.appendChild(div);

                    setTimeout(() => {
                        div.classList.add("show");
                        setTimeout(() => div.style.boxShadow = "", 500);
                    }, 300 * index);
                });
            }
            updateHistory();
        });
    }

    function showSidebarCollection() {
        const box = document.getElementById("sidebar-content");
        box.innerHTML = "<h2>Collection</h2>";

        Object.entries(collection).forEach(([name, count]) => {
            box.innerHTML += `
                <div class='collection-entry'>
                    <strong>${name}</strong> — Owned: ${count}
                </div>
            `;
        });
    }

    function showSidebarHistory() {
        const box = document.getElementById("sidebar-content");
        box.innerHTML = `<h2>Pull History</h2><div class='section-title'>Limited Banner</div>`;

        // Numbered Limited Banner
        historyLimited.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white"; // 5 star = gold
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });

        box.innerHTML += `<div class='section-title'>Light Cone Banner</div>`;

        // Numbered Light Cone Banner
        historyLightcone.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });

        box.innerHTML += `<div class='section-title'>Standard Banner</div>`;

        // Numbered Standard Banner
        historyStandard.forEach((i, idx) => {
            const color = i.rarity === 5 ? "gold" : "white";
            box.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin:4px 0; color:${color};">
                    <div style="width:20px; text-align:right;">${idx + 1}.</div>
                    <img src="${i.img}" style="width:40px; height:40px; border-radius:6px;">
                    <div>${i.name} — ${i.rarity} star</div>
                </div>
            `;
        });
    }

    function openSidebar(type) {
        const sidebar = document.getElementById("sidebar");
        const box = document.getElementById("sidebar-content");

        sidebar.classList.add("active");

        if (type === "collection") {
            showSidebarCollection();
        } else if (type === "history") {
            showSidebarHistory();
        }
    }

    function closeSidebar() {
        document.getElementById("sidebar").classList.remove("active");
    }
    
    function playWarpAnimation(rarity, callback) {
        const screen = document.getElementById("warp-screen");
        const ticket = document.getElementById("ticket");
        const canvas = document.getElementById("warp-canvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // Star parameters
        const starCount = 80;
        const minRadius = 100;
        const maxRadius = 300;
        const stars = [];

        for (let i = 0; i < starCount; i++) {
            const angle = Math.random() * 2 * Math.PI;
            const radius = minRadius + Math.random() * (maxRadius - minRadius);
            const speed = 0.01 + Math.random() * 0.03;
            const size = 2 + Math.random() * 2;
            const color = (rarity === 5 && Math.random() < 0.2) ? "#FFD700" : (Math.random() < 0.5 ? "#7abaff" : "#d29aff");
            const alphaSpeed = 0.02 + Math.random() * 0.03; // fade speed
            const alphaOffset = Math.random();
            stars.push({ angle, radius, speed, size, color, alpha: 0, alphaSpeed, alphaOffset });
        }

        let frame = 0;

        function animate() {
            ctx.fillStyle = "rgba(0,0,0,0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                star.angle += star.speed;

                // Star position
                const x = cx + Math.cos(star.angle) * star.radius;
                const y = cy + Math.sin(star.angle) * star.radius;

                // Fade in/out for twinkle
                star.alpha = 0.5 + 0.5 * Math.sin(frame * star.alphaSpeed + star.alphaOffset * Math.PI * 2);

                ctx.beginPath();
                ctx.arc(x, y, star.size, 0, 2 * Math.PI);
                ctx.fillStyle = `rgba(${hexToRgb(star.color)},${star.alpha})`;
                ctx.fill();
            });

            frame++;
            if (frame < 90) requestAnimationFrame(animate); // ~1.5s
        }

        // Flash and ticket
        screen.classList.remove("gold-flash", "purple-flash", "blue-flash");
        if (rarity === 5) screen.classList.add("gold-flash");
        else if (rarity === 4) screen.classList.add("purple-flash");
        else screen.classList.add("blue-flash");

        screen.classList.add("active");
        ticket.classList.add("show");

        animate();

        setTimeout(() => {
            screen.classList.remove("active");
            ticket.classList.remove("show");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            callback();
        }, 1500);
    }

    // Helper: convert hex to r,g,b
    function hexToRgb(hex) {
        hex = hex.replace("#", "");
        const bigint = parseInt(hex, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `${r},${g},${b}`;
    }

    function updateHistory() {
        const h = document.getElementById("history");
        h.innerHTML = history.map(i =>
            `<div>${i.name} — ${i.rarity} star</div>`
        ).join("");
    }

    function toggleCollection() {
        const box = document.getElementById("collection-box");
        if (box.style.display === "none") showCollection();
        else box.style.display = "none";
    }

    function showCollection() {
        const box = document.getElementById("collection-box");
        box.style.display = "block";
        box.innerHTML = "<h2>Your Collection</h2>";

        Object.entries(collection).forEach(([name, count]) => {
            box.innerHTML += `
                <div class='collection-entry'>
                    <strong>${name}</strong> — Owned: ${count}
                </div>
            `;
        });
    }

    let clickTimes = [];
    const cheatIcon = document.getElementById("cheat-icon");
    const cheatInput = document.getElementById("cheat-input");

    let cheatActive = false;
    let cheat10x5Star = false;
    let hardMode = false;

    cheatIcon.addEventListener("click", () => {
        const now = Date.now();
        clickTimes.push(now);

        clickTimes = clickTimes.filter(t => now - t <= 3000);

        if (clickTimes.length >= 10 && !cheatActive) {
            cheatActive = true;
            cheatInput.style.display = "block";
            cheatInput.focus();
        }
    });

    cheatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            if (cheatInput.value.toUpperCase() === "LUCKY") {
                alert("Cheat activated! Next 10 pulls are all guaranteed 5 star!");
                cheat10x5Star = true;
            }
            if (cheatInput.value.toUpperCase() === "DIOLATASUCKS") {
                alert("Challenge activated! Next 100 pulls there is the chance to get a trashbag (which will not let a five character appear for the next 10 pull)!");
                cheatTrashbagActive = true;
                cheatTrashbagPullsLeft = 100;
            }
            cheatInput.value = "";
            cheatInput.style.display = "none";
            cheatActive = false;
            clickTimes = [];
        }
    });

    document.getElementById("banner").addEventListener("change", updateBannerImage);
    updateBannerImage();
</script>
