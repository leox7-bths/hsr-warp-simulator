<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://raw.githubusercontent.com/leox7-bths/hsr-warp-simulator/refs/heads/main/icon.png" type="image/png">
</head>
<body>

<h1>Collection</h1>
<button class="warp-button" onclick="window.location.href='index.html'">← Back to Banner</button>


<!-- CHARACTERS TAB -->
<div class="tab" onclick="toggleTab('characters-tab')">Characters</div>
<div id="characters-tab" class="tab-content">
    <div id="character-container"></div>
</div>

<!-- LIGHT CONES TAB -->
<div class="tab" onclick="toggleTab('lightcones-tab')">Light Cones</div>
<div id="lightcones-tab" class="tab-content">
    <div id="lightcone-container"></div>
</div>


<script src="bannerPools.js"></script>

<script>
const rarityColors = {
    3: "#4a90e2",
    4: "#9b59b6",
    5: "#f1c40f"
};

// TAB OPEN/CLOSE
function toggleTab(id) {
    const tab = document.getElementById(id);
    const header = tab.previousElementSibling;

    if (tab.style.display === "block") {
        tab.style.display = "none";
        header.classList.remove("open");
    } else {
        tab.style.display = "block";
        header.classList.add("open");
    }
}

// LOAD COLLECTION
window.onload = () => {
    const collection = JSON.parse(localStorage.getItem("hsrCollection") || "{}");

    const characterContainer = document.getElementById("character-container");
    const lightconeContainer = document.getElementById("lightcone-container");

    if (Object.keys(collection).length === 0) {
        characterContainer.innerHTML = "<p>No items in your collection yet!</p>";
        lightconeContainer.innerHTML = "<p>No items in your collection yet!</p>";
        return;
    }

    const allItems = [
        ...standard5,
        ...standardlc5,
        ...all4,
        ...lightcones3,
        ...lightcones4,
        ...seeleLimited5,
        ...seeleLimited4,
        ...seelelcLimited5,
        ...seelelcLimited4,
        ...jingyuanLimited5,
        ...jingyuanLimited4,
        ...jingyuanlcLimited5,
        ...jingyuanlcLimited4,
        ...silverWolfLimited5,
        ...silverWolfLimited4,
        ...silverWolflcLimited5,
        ...silverWolflcLimited4
    ];

    const lightconeArrays = new Set([
        ...standardlc5,
        ...lightcones3,
        ...lightcones4,
        ...seelelcLimited5,
        ...seelelcLimited4,
        ...jingyuanlcLimited5,
        ...jingyuanlcLimited4,
        ...silverWolflcLimited5,
        ...silverWolflcLimited4
    ].map(i => i.name));

    // 3D model redirect map
    const modelPages = {
        "Jing Yuan": "characterModel/jing_yuan.html",
        "Seele": "characterModel/seele.html",
        "Silver Wolf": "characterModel/silver_wolf.html",
        "Asta": "characterModel/asta.html",
        "Serval": "characterModel/serval.html",
        "Natasha": "characterModel/natasha.html",
        "Hook": "characterModel/hook.html", //no
        "Pela": "characterModel/pela.html", //no
        "March 7th": "characterModel/march_7th.html",
        "Tingyun": "characterModel/tingyun.html",
        "Sushang": "characterModel/sushang.html",
        "Sampo": "characterModel/sampo.html",
        "Qingque": "characterModel/qingque.html",
        "Dan Heng": "characterModel/dan_heng.html",
        "Welt": "characterModel/welt.html",
        "Gepard": "characterModel/gepard.html",
        "Himeko": "characterModel/himeko.html",
        "Yanqing": "characterModel/yanqing.html",
        "Clara": "characterModel/clara.html",
        "Bronya": "characterModel/bronya.html",
        "Bailu": "characterModel/bailu.html"
    };

    // Split into characters / light cones based on detection
    let characters = [];
    let lightcones = [];

    Object.entries(collection).forEach(([name, count]) => {
        let item = allItems.find(i => i.name === name);
        if (!item) return;

        if (lightconeArrays.has(name)) {
            lightcones.push({ ...item, count });
        } else {
            characters.push({ ...item, count });
        }
    });

    // SORT BY RARITY (desc) THEN NAME (asc)
    function sortByRarityThenName(list) {
        return list.sort((a, b) => {
            if (b.rarity !== a.rarity) {
                return b.rarity - a.rarity; //rarity
            } else {
                return a.name.localeCompare(b.name); //alphabetical
            }
        });
    }

    characters = sortByRarityThenName(characters);
    lightcones = sortByRarityThenName(lightcones);

    function render(list, container) {
        list.forEach(entry => {
            const div = document.createElement("div");
            div.className = "collection-entry";
            // set the rarity color as a CSS variable for the ::after gradient
            div.style.setProperty("--rarity-color", rarityColors[entry.rarity] || "#fff");

            div.innerHTML = `
                <img src="${entry.img}">
                <div><strong>${entry.name}</strong></div>
                <div>Owned: ${entry.count}</div>
            `;

            if (modelPages[entry.name]) {
                div.onclick = () => window.location.href = modelPages[entry.name];
            }

            container.appendChild(div);
        });
    }

    render(characters, characterContainer);
    render(lightcones, lightconeContainer);
};
</script>

</body>
</html>
